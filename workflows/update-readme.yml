name: 🔄 Regenerate Organization README

on:
  schedule:
    - cron: "0 6 * * *"        # every day at 06:00 UTC
  workflow_dispatch:            # manual trigger button
  push:
    branches: [main]
    paths:
      - "profile/README.md"
      - ".github/scripts/generate_readme.py"

permissions:
  contents: write

concurrency:
  group: readme-regen
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🔑 Regenerate README from GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/generate_readme.py

      - name: 💾 Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git diff --staged --quiet || git commit -m "docs: auto-update README from GitHub API [skip ci]"
          git diff --staged --quiet || git push
