name: Update Organization README

on:
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'profile/README.md'
      - 'scripts/update_readme.py'
      - 'requirements.txt'
      - '.github/workflows/update-readme.yml'

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    name: Regenerate profile/README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORG: JalaU-Capstones
      README_PATH: profile/README.md

    steps:
      - name: Start timer
        id: timer
        run: echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate ORG_READ_TOKEN
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.environ.get('GH_TOKEN')
          if not token:
              print('ERROR: Missing GH_TOKEN / ORG_READ_TOKEN. Define the fine-grained PAT secret before running this workflow.', file=sys.stderr)
              raise SystemExit(1)

          try:
              resp = requests.get(
                  'https://api.github.com/user',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'JalaU-Capstones-README-Updater',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  timeout=30,
              )
          except requests.RequestException as exc:
              print(f'ERROR: Unable to validate GH_TOKEN: {exc}', file=sys.stderr)
              raise SystemExit(1)

          if resp.status_code in (401, 403):
              print('ERROR: GitHub rejected the token. Verify ORG_READ_TOKEN is valid, not expired, and has Metadata: Read-only and Contents: Read-only for JalaU-Capstones.', file=sys.stderr)
              raise SystemExit(1)

          if resp.status_code >= 400:
              print(f'ERROR: Token validation failed with HTTP {resp.status_code}: {resp.text[:200]}', file=sys.stderr)
              raise SystemExit(1)

          payload = resp.json()
          print(f'Validated token for login: {payload.get("login", "unknown")}')
          PY

      - name: Validate stats access
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.environ.get('GH_TOKEN')
          session = requests.Session()
          session.headers.update({
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'JalaU-Capstones-README-Updater',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          resp = session.get('https://api.github.com/orgs/JalaU-Capstones/repos', params={'type': 'public', 'per_page': 100}, timeout=30)
          if resp.status_code in (401, 403):
              print('ERROR: The PAT cannot read organization repositories. Verify ORG_READ_TOKEN permissions and validity.', file=sys.stderr)
              raise SystemExit(1)
          if resp.status_code >= 400:
              print(f'ERROR: Repo listing failed with HTTP {resp.status_code}: {resp.text[:200]}', file=sys.stderr)
              raise SystemExit(1)

          repos = resp.json()
          repo = next((entry for entry in repos if entry.get('name') not in ('.github',) and not entry.get('fork')), None)
          if repo is None:
              print('ERROR: No organization repositories were found to validate stats access.', file=sys.stderr)
              raise SystemExit(1)

          stats_resp = session.get(f"https://api.github.com/repos/JalaU-Capstones/{repo['name']}/stats/commit_activity", timeout=30)
          if stats_resp.status_code in (401, 403):
              print('ERROR: The PAT cannot read stats endpoints. Verify ORG_READ_TOKEN includes Metadata: Read-only and Contents: Read-only.', file=sys.stderr)
              raise SystemExit(1)
          if stats_resp.status_code == 202:
              print(f"Validated stats endpoint for {repo['name']}; GitHub is still computing commit activity.")
          elif stats_resp.status_code >= 400:
              print(f'ERROR: Stats validation failed for {repo["name"]}: HTTP {stats_resp.status_code}', file=sys.stderr)
              raise SystemExit(1)
          else:
              print(f'Validated stats endpoint for {repo["name"]}.')
          PY

      - name: Run README updater
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: JalaU-Capstones
          README_PATH: profile/README.md
        run: |
          python scripts/update_readme.py 2>&1 | tee /tmp/readme_update.log

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(readme): auto-update organization README [skip ci]"
          git push

      - name: Job summary
        if: always()
        run: |
          chart_count=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('profile/README.md').read_text(encoding='utf-8')
          print(len(re.findall(r'quickchart\.io/chart\?c=', text)))
          PY
          )

          skipped_count=$(grep -c 'are being computed' /tmp/readme_update.log 2>/dev/null || true)

          {
            echo '### README updater summary'
            echo ''
            echo "- Organization: \`${ORG}\`"
            echo '- README path: `profile/README.md`'
            echo "- Changes detected: \`${{ steps.changes.outputs.changed || 'unknown' }}\`"
            echo "- Triggered by: \`${{ github.event_name }}\`"
            echo "- Charts rendered: \`${chart_count}\`"
            echo "- Stats skipped (202): \`${skipped_count}\`"
          } >> "$GITHUB_STEP_SUMMARY"
