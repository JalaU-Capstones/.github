name: Update Organization README

on:
  schedule:
    - cron: '0 3 * * 1'

  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - 'profile/README.md'
      - 'scripts/update_readme.py'
      - 'requirements.txt'
      - '.github/workflows/update-readme.yml'

concurrency:
  group: update-readme-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update-readme:
    name: Regenerate profile/README.md
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORG: JalaU-Capstones
      README_PATH: profile/README.md

    steps:
      - name: Start timer
        id: timer
        run: echo "start_epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate ORG_READ_TOKEN
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.environ.get('GH_TOKEN')
          if not token:
              print('ERROR: Missing GH_TOKEN / ORG_READ_TOKEN. Define the fine-grained PAT secret before running this workflow.', file=sys.stderr)
              raise SystemExit(1)

          try:
              resp = requests.get(
                  'https://api.github.com/user',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'User-Agent': 'JalaU-Capstones-README-Updater',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
                  timeout=30,
              )
          except requests.RequestException as exc:
              print(f'ERROR: Unable to validate GH_TOKEN: {exc}', file=sys.stderr)
              raise SystemExit(1)

          if resp.status_code in (401, 403):
              print('ERROR: GitHub rejected the token. Verify ORG_READ_TOKEN is valid, not expired, and has Metadata: Read-only and Contents: Read-only for JalaU-Capstones.', file=sys.stderr)
              raise SystemExit(1)

          if resp.status_code >= 400:
              print(f'ERROR: Token validation failed with HTTP {resp.status_code}: {resp.text[:200]}', file=sys.stderr)
              raise SystemExit(1)

          payload = resp.json()
          print(f'Validated token for login: {payload.get("login", "unknown")}')
          PY

      - name: Verify languages payload shape
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import sys
          import requests

          token = os.environ.get('GH_TOKEN')
          if not token:
              print('ERROR: Missing GH_TOKEN / ORG_READ_TOKEN.', file=sys.stderr)
              raise SystemExit(1)

          session = requests.Session()
          session.headers.update({
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'User-Agent': 'JalaU-Capstones-README-Updater',
              'X-GitHub-Api-Version': '2022-11-28',
          })

          resp = session.get('https://api.github.com/orgs/JalaU-Capstones/repos', params={'type': 'public', 'per_page': 100}, timeout=30)
          if resp.status_code >= 400:
              print(f'ERROR: Repo listing failed with HTTP {resp.status_code}: {resp.text[:200]}', file=sys.stderr)
              raise SystemExit(1)

          repos = resp.json()
          repo = next((entry for entry in repos if entry.get('name') not in ('.github',) and not entry.get('fork')), None)
          if repo is None:
              print('ERROR: No organization repositories were found to validate language payload shape.', file=sys.stderr)
              raise SystemExit(1)

          lang_resp = session.get(f"https://api.github.com/repos/JalaU-Capstones/{repo['name']}/languages", timeout=30)
          if lang_resp.status_code >= 400:
              print(f'ERROR: Language validation failed for {repo["name"]}: HTTP {lang_resp.status_code}', file=sys.stderr)
              raise SystemExit(1)

          payload = lang_resp.json()
          if not isinstance(payload, dict):
              print(f'ERROR: Unexpected languages payload type for {repo["name"]}: {type(payload).__name__}; expected dict[str, int].', file=sys.stderr)
              raise SystemExit(1)

          for name, value in payload.items():
              if not isinstance(value, int) or isinstance(value, bool):
                  print(f'ERROR: Unexpected language payload shape for {repo["name"]}: {name}={value!r} ({type(value).__name__}); expected int.', file=sys.stderr)
                  raise SystemExit(1)

          print(f'Validated language payload for {repo["name"]}: {len(payload)} entries.')
          PY

      - name: Self-test updater
        run: |
          python scripts/update_readme.py --self-test

      - name: Run README updater
        env:
          GH_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          ORG: JalaU-Capstones
          README_PATH: profile/README.md
        run: |
          set -o pipefail
          python scripts/update_readme.py 2>&1 | tee /tmp/readme_update.log

      - name: Check README was updated
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('profile/README.md').read_text(encoding='utf-8')
          markers = (
              ('projects', '<!-- PROJECTS_START -->', '<!-- PROJECTS_END -->'),
              ('stats', '<!-- STATS_START -->', '<!-- STATS_END -->'),
          )

          for label, start_marker, end_marker in markers:
              start_index = readme.find(start_marker)
              end_index = readme.find(end_marker, start_index if start_index != -1 else 0)
              if start_index == -1 or end_index == -1:
                  raise SystemExit(f'ERROR: README marker pair missing for {label}.')
              body = readme[start_index + len(start_marker):end_index].strip()
              if not body:
                  raise SystemExit(f'ERROR: README marker block for {label} is empty after the updater run.')

          print('README markers are populated.')
          PY

      - name: Detect changes
        id: changes
        if: success()
        run: |
          if git diff --quiet -- profile/README.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: success() && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/README.md
          git commit -m "chore(readme): auto-update organization README [skip ci]"
          git push

      - name: Job summary
        if: always()
        run: |
          status="${{ job.status }}"
          repo_count=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('profile/README.md').read_text(encoding='utf-8')
          print(len(re.findall(r'^#### \[', text, flags=re.MULTILINE)))
          PY
          )
          category_count=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path('profile/README.md').read_text(encoding='utf-8')
          print(len(re.findall(r'^### ', text, flags=re.MULTILINE)))
          PY
          )

          {
            echo '### README Updater Summary'
            echo ''
            echo "- **Status:** ${status}"
            echo "- **Organization:** \`${ORG}\`"
            echo '- **README path:** `profile/README.md`'
            echo "- **Triggered by:** \`${{ github.event_name }}\`"
            echo "- **Repositories:** \`${repo_count:-unknown}\`"
            echo "- **Categories:** \`${category_count:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"
